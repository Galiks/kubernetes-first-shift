apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: pavel-lab
  labels:
    app: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.28.0-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: APP_MODE
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: web-config
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: web-secret
              mountPath: /etc/lab-secret
              readOnly: true
      volumes:
        - name: web-config
          configMap:
            name: web-config
            items:
              - key: index.html
                path: index.html
        - name: web-secret
          secret:
            secretName: web-secret
