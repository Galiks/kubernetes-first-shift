# apiVersion — указывает версию Kubernetes API. Для Deployment используется v1
apiVersion: apps/v1
# kind — тип ресурса. Здесь мы создаём Deployment — контроллер, управляющий Pod'ами
kind: Deployment
# metadata — метаданные ресурса
metadata:
  # name — имя Deployment'а. По нему будем обращаться к этому ресурсу
  name: web
  # namespace — пространство имён, в котором создаётся Deployment
  namespace: pavel-lab
  # labels — метки для группировки и фильтрации ресурсов
  labels:
    app: web
    env: development
# spec — спецификация того, что мы хотим получить от Deployment'а
spec:
  # replicas — сколько копий (Pod'ов) должно работать постоянно
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1 # Maximum extra pods
      maxUnavailable: 0 # Maximum unavailable pods
  # selector — как Deployment находит Pod'ы, которыми управляет
  selector:
    matchLabels:
      # Pod должен иметь метку app: web
      app: web
  # template — шаблон Pod'а, который будет создавать Deployment
  template:
    metadata:
      # labels — метки, которые будут присвоены каждому Pod'у из этого шаблона
      labels:
        app: web
    # spec — спецификация самого Pod'а (что внутри)
    spec:
      # containers — список контейнеров в Pod'е
      containers:
        # - name — имя контейнера (для логирования, exec и т.д.)
        - name: web
          # image — Docker-образ, из которого будет создан контейнер
          # nginxinc/nginx-unprivileged — официальный nginx без root-прав
          # sha256:... — точная версия образа (иммутабельная ссылка)
          # image: nginxinc/nginx-unprivileged@sha256:4044f219dbf61dcca96362290ff271b545387ee4c2acdc9027d6b6f5aef231fe
          image: nginx:1.28.0-alpine
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          # env — переменные окружения, передаваемые в контейнер
          env:
            # - name — имя переменной внутри контейнера
            - name: APP_MODE
              # valueFrom — значение берётся не статически, а из другого источника
              valueFrom:
                # configMapKeyRef — ссылка на ключ из ConfigMap
                configMapKeyRef:
                  # name — имя ConfigMap, из которого берём значение
                  name: web-config
                  # key — конкретный ключ внутри этого ConfigMap
                  key: APP_MODE
          # volumeMounts — точки монтирования томов (volume) внутрь контейнера
          volumeMounts:
            # - name — имя тома (должно совпадать с именем в разделе volumes ниже)
            - name: config-volume
              # mountPath — путь в файловой системе контейнера, куда будет примонтирован том
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: secret-volume
              mountPath: /etc/lab-secret
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      # volumes — описание томов, которые доступны Pod'у
      volumes:
        # - name — имя тома для связи с volumeMounts
        - name: config-volume
          # configMap — том создаётся из данных ConfigMap
          configMap:
            # name — имя ConfigMap, из которого берём данные
            name: web-config
            # items — фильтр: какие именно ключи из ConfigMap попадут в том
            items:
              # - key — ключ из ConfigMap (index.html)
              - key: index.html
                # path — имя файла, под которым этот ключ появится в томе
                path: index.html
        - name: secret-volume
          secret:
            secretName: web-secret
