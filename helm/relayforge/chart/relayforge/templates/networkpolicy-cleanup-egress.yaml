{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "relayforge.fullname" . }}-cleanup-egress
  labels:
    {{- include "relayforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cleanup
  policyTypes:
  - Egress
  egress:
  # Kubernetes API
  - to:
    - ipBlock:
        cidr: {{ .Values.networkPolicy.kubernetesApiCidr }}
    ports:
    - port: 443
      protocol: TCP
  # DNS
  - to:
    - namespaceSelector: {}
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
{{- end }}