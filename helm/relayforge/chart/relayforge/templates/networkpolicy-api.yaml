{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "relayforge.fullname" . }}-api
  labels:
    {{- include "relayforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "relayforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - port: 8080
      protocol: TCP
  egress:
  - to:
    - ipBlock:
        cidr: {{ .Values.networkPolicy.kubernetesApiCidr }}
    ports:
    - port: 443
      protocol: TCP
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
{{- end }}