image:
  repository: localhost:5050/relayforge
  digest: ""

nameOverride: ""
fullnameOverride: ""

api:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  backpressure:
    maxActiveJobs: 10
    maxConcurrentCreate: 2

worker:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  permanentExitCode: 12
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  signingSecret:
    name: ""
    key: "signing-key"

testSink:
  enabled: true
  verificationSecret:
    name: ""
    key: "verification-key"
  controlSecret:
    name: ""
    key: "control-token"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

clientAuthSecret:
  name: ""
  key: "client-token"

secretRevision: "1"

networkPolicy:
  enabled: true
  kubernetesApiCidr: "10.43.0.0/16"
  externalDestinationCidrs: []

cleanup:
  activeDeadlineSeconds: 120
