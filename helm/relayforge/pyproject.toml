[project]
name = "relayforge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "httpx==0.27.2",
  "kubernetes-asyncio>=31.0.0",
  "prometheus-client==0.21.0",
  "pydantic==2.9.2",
  "orjson==3.10.7",
  "cryptography==43.0.1",
]

[project.scripts]
relayforge = "relayforge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relayforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]