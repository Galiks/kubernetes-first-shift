{{- if and .Values.networkPolicy.enabled .Values.testSink.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "relayforge.fullname" . }}-test-sink-ingress
  labels:
    {{- include "relayforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: test-sink
  policyTypes:
  - Ingress
  ingress:
  # От worker этого release
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: {{ .Release.Name }}
          app.kubernetes.io/component: delivery
    ports:
    - port: 8080
      protocol: TCP
  # От helm-test этого release
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: {{ .Release.Name }}
          app.kubernetes.io/component: helm-test
    ports:
    - port: 8080
      protocol: TCP
  # От api этого release (UI: sink state/mode/reset, тестовый прогон)
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: {{ .Release.Name }}
          app.kubernetes.io/component: api
    ports:
    - port: 8080
      protocol: TCP
{{- end }}