apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "relayforge.fullname" . }}-api
  labels:
    {{- include "relayforge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "relayforge.fullname" . }}-api
subjects:
- kind: ServiceAccount
  name: {{ include "relayforge.fullname" . }}-api