{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "relayforge.fullname" . }}-api-ingress
  labels:
    {{- include "relayforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes:
  - Ingress
  ingress:
  # Только helm-test этого release; неизвестные client-поды и другой release не проходят.
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: {{ .Release.Name }}
          app.kubernetes.io/component: helm-test
    ports:
    - port: {{ .Values.api.port }}
      protocol: TCP
{{- end }}