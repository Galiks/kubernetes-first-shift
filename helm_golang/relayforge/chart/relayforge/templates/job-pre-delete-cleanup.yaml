apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "relayforge.fullname" . }}-cleanup
  labels:
    {{- include "relayforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.cleanup.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        {{- include "relayforge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cleanup
    spec:
      serviceAccountName: {{ include "relayforge.fullname" . }}-cleanup
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cleanup
        image: {{ include "relayforge.image" . }}
        imagePullPolicy: IfNotPresent
        command: ["/relayforge", "cleanup"]
        env:
        - name: RELAYFORGE_RELEASE
          value: {{ .Release.Name | quote }}
        - name: RELAYFORGE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]