apiVersion: v1
kind: Service
metadata:
  name: {{ include "relayforge.fullname" . }}-api
  labels:
    {{- include "relayforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "relayforge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
  - name: http
    port: {{ .Values.api.port }}
    targetPort: http