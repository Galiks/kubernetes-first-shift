apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "relayforge.fullname" . }}-cleanup
  labels:
    {{- include "relayforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "relayforge.fullname" . }}-cleanup
subjects:
- kind: ServiceAccount
  name: {{ include "relayforge.fullname" . }}-cleanup
  namespace: {{ .Release.Namespace }}