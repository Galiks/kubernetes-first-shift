apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "relayforge.fullname" . }}-cleanup
  labels:
    {{- include "relayforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cleanup
rules:
# Масштабирование своего API Deployment до нуля
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "patch"]
  resourceNames:
  - {{ include "relayforge.fullname" . }}-api
# Удаление Jobs своего release
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["list", "delete"]