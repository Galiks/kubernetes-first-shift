# Source: relayforge/templates/deployment-test-sink.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-a-relayforge-test-sink
  labels:
    helm.sh/chart: relayforge-0.1.0
    app.kubernetes.io/name: relayforge
    app.kubernetes.io/instance: relay-a
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: test-sink
spec:
  # Test-sink всегда одна реплика (требование задания)
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: relayforge
      app.kubernetes.io/instance: relay-a
      app.kubernetes.io/component: test-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relayforge
        app.kubernetes.io/instance: relay-a
        app.kubernetes.io/component: test-sink
      annotations:
        # Перезапуск при ротации секретов
        checksum/secretRevision: 19158c4a7252e121f7367e7e86a3baabbf93fded76110076cfab2b31eb7df887
    spec:
      # Отдельный ServiceAccount без RBAC
      serviceAccountName: relay-a-relayforge-test-sink
      automountServiceAccountToken: false

      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # fsGroup даёт non-root процессу право писать в emptyDir
        # БЕЗ privileged и БЕЗ root init container (требование задания)
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: test-sink
        image: localhost:5050/relayforge@sha256:2ead2e3c9ba7df1fb8472bb6e18988c2619a6cce67e639523b18db06753efac0
        imagePullPolicy: IfNotPresent
        # Exec-form без shell (требование задания)
        command: ["python", "-m", "relayforge", "test-sink"]

        env:
        - name: RELAYFORGE_RELEASE
          value: "relay-a"
        - name: RELAYFORGE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: RELAYFORGE_TEST_SINK_PORT
          value: "8080"
        - name: RELAYFORGE_RECEIPTS_DIR
          value: "/var/lib/relayforge-test-sink/receipts"

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        # Probes
        startupProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 2
          failureThreshold: 15
        readinessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          failureThreshold: 3

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

        # Restricted container security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

        volumeMounts:
        # Секреты: verification key + control-token (read-only)
        - name: secrets
          mountPath: /etc/relayforge/secrets
          readOnly: true
        # emptyDir для receipts (read-write, но только для тестовой оснастки)
        - name: receipts
          mountPath: /var/lib/relayforge-test-sink/receipts
        # tmp для Python (readOnlyRootFilesystem требует /tmp)
        - name: tmp
          mountPath: /tmp

      volumes:
      # Секреты монтируются как файлы (требование задания)
      - name: secrets
        projected:
          sources:
          # Verification key (для проверки HMAC)
          - secret:
              name: relay-a-verification
              items:
              - key: verification-key
                path: verification-key
          # Control token (для управления режимами)
          - secret:
              name: relay-a-verification
              items:
              - key: control-token
                path: control-token

      # emptyDir: данные переживают restart контейнера, но НЕ замену Pod
      - name: receipts
        emptyDir:
