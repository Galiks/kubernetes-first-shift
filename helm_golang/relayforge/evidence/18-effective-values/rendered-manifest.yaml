# Source: relayforge/templates/networkpolicy-api-egress.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-a-relayforge-api-egress
  labels:
    helm.sh/chart: relayforge-0.1.0
    app.kubernetes.io/name: relayforge
    app.kubernetes.io/instance: relay-a
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: relay-a
      app.kubernetes.io/component: api
  policyTypes:
  - Egress
  egress:
  # Kubernetes API: egress-правила применяются к трафику ПОСЛЕ DNAT сервиса,
  # поэтому порт endpoint (6443 для k3s) разрешается вместе с портом сервиса.
  - to:
    - ipBlock:
        cidr: 172.18.0.0/16
    ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
  # DNS
  - to:
    - namespaceSelector: {}
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
